name: key-service

services:
  app:
    env_file:
      - .env
    build: .
    container_name: key-service
    user: "1002:1002"   # ← Ausgabe von `id trustylynx` eintragen
    ports:
      - "7492:8080"
    restart: unless-stopped
    volumes:
      - /opt/trustylynx/key-service/data:/app/data

networks:
  default:
    name: trustylynx-net
    external: true