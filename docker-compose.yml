name: key-service

services:
  app:
    env_file:
      - .env
    build: .
    container_name: key-service
    user: "1002:1002"
    ports:
      - "7492:8080"
    restart: unless-stopped
    networks:
      - trustylynx-net
      - key-db-net

networks:
  trustylynx-net:
    external: true
  key-db-net:
    external: true